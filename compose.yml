name: de-build

services:
  mill:
    # The digest pins Temurin 21.0.11+10; Mill selects each module's own JDK.
    image: eclipse-temurin:25-jdk@sha256:97014c4b396021f9ddb7d592a7dbedb0c4e4215c29e03dc01c393558aefb71c2
    working_dir: ${DE_WORKSPACE:-/workspace}
    volumes:
      - .:${DE_WORKSPACE:-/workspace}
      # Mill treats reads within the checkout as task inputs. Resolver caches
      # must therefore appear outside it, even though they persist on the host.
      - type: bind
        source: ./.docker-cache
        target: /cache
        bind:
          create_host_path: false
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      XDG_CACHE_HOME: /cache
      SPARK_LOCAL_IP: 127.0.0.1
    # Reuse the localhost endpoints in every example's README and Kafka metadata.
    # Docker Desktop requires Settings > Resources > Network > host networking.
    network_mode: host
    init: true
    entrypoint: ["./mill", "--no-server", "-j", "2"]
    command: ["resolve", "__"]
