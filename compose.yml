name: de-build

services:
  mill:
    # The digest pins Temurin 21.0.11+10; Mill selects each module's own JDK.
    image: eclipse-temurin:21-jdk@sha256:85f00967bcc624fc19fa9c2cf124ea426a5363898e267141726f31f358c2e14b
    working_dir: ${DE_WORKSPACE:-/workspace}
    volumes:
      - .:${DE_WORKSPACE:-/workspace}
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      XDG_CACHE_HOME: ${DE_WORKSPACE:-/workspace}/.docker-cache
      SPARK_LOCAL_IP: 127.0.0.1
    # Reuse the localhost endpoints in every example's README and Kafka metadata.
    # Docker Desktop requires Settings > Resources > Network > host networking.
    network_mode: host
    init: true
    entrypoint: ["./mill", "--no-server", "-j", "2"]
    command: ["resolve", "__"]

