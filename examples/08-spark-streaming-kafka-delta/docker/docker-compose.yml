# Local stack for example 08: Apache Kafka -> Apache Spark Structured Streaming -> Delta Lake.
#
# Every published host port is inside this example's reserved range 10800-10899,
# so this stack can run next to every other example in the repository.
#
# Apache Spark itself is NOT a service here. The job runs in your own JVM through
# `./mill examples.08-spark-streaming-kafka-delta.run`, which keeps the feedback
# loop short and lets you attach a debugger.
name: de-08-spark-streaming

services:
  # Apache Kafka in KRaft mode: this one container is both the controller (the
  # component that stores cluster metadata) and the broker, so no ZooKeeper is
  # needed.
  kafka:
    image: apache/kafka:3.9.0
    container_name: de-08-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is the address other containers use, EXTERNAL the one your
      # machine uses. A Kafka client is redirected to the address advertised for
      # the listener it connected on, so the two have to be configured apart.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:10892
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:10892
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: de-08-spark-streaming-cluster
    ports:
      - "10892:10892"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    networks: [de08]

  # Creates the orders topic with four partitions, then exits. Four partitions
  # let Spark read with four parallel tasks; auto-created topics would get one.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: de-08-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic orders --partitions 4 --replication-factor 1 &&
      echo 'topic orders is ready'
      "
    networks: [de08]

  # MinIO speaks the Amazon S3 API, so Delta Lake writes to it exactly the way it
  # would write to real object storage - which is where a lakehouse table lives
  # in production.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: de-08-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # S3 API: http://localhost:10890
      - "10890:9000"
      # MinIO web console: http://localhost:10891
      - "10891:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks: [de08]

  # A one-shot container that creates the bucket the Delta tables live in.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: de-08-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/lakehouse &&
      echo 'bucket local/lakehouse is ready'
      "
    networks: [de08]

  # A web user interface for Kafka: browse topics, inspect the order JSON and
  # watch the consumer offsets the Spark checkpoint commits.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: de-08-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      KAFKA_CLUSTERS_0_NAME: de-08
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      # http://localhost:10880
      - "10880:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks: [de08]

networks:
  de08:
    name: de-08-spark-streaming

volumes:
  minio-data:
