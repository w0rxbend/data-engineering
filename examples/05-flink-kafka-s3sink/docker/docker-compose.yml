# Local stack for example 05: Apache Kafka -> Apache Flink -> S3-compatible storage.
#
# Every published host port is inside this example's reserved range 10500-10599,
# so this stack can run next to every other example in the repository.
name: de-05-flink-s3

services:
  # Apache Kafka in KRaft mode: one container acts as both the controller (the
  # component that stores cluster metadata) and the broker, so no ZooKeeper is
  # needed.
  kafka:
    image: apache/kafka:3.9.0
    container_name: de-05-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is what other containers use, EXTERNAL is what your machine uses.
      # A Kafka client is redirected to the address advertised for the listener it
      # connected on, which is why the two must be configured separately.
      # The controller listener needs a routable address: Kafka refuses to advertise 0.0.0.0.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:10592
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:10592
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: de-05-flink-s3-cluster
    ports:
      - "10592:10592"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    networks: [de05]

  # MinIO speaks the Amazon S3 API, so the Flink S3 filesystem talks to it the
  # same way it would talk to real object storage.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: de-05-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "10590:9000"
      - "10591:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks: [de05]

  # A one-shot container that creates the bucket and then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: de-05-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/orders &&
      echo 'bucket local/orders is ready'
      "
    networks: [de05]

  jobmanager:
    image: apache/flink:1.20.1-scala_2.12-java17
    container_name: de-05-jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      # Flink web user interface: http://localhost:10581
      - "10581:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        execution.checkpointing.mode: EXACTLY_ONCE
        # Checkpoints go to object storage too, which is what a real cluster does.
        state.checkpoints.dir: s3://orders/flink-checkpoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
    # The S3 filesystem ships with Flink but is inactive until it is moved into
    # the plugins directory, which is how Flink keeps its dependencies isolated.
    command: >
      /bin/bash -c "
      mkdir -p /opt/flink/plugins/s3-fs-hadoop &&
      cp /opt/flink/opt/flink-s3-fs-hadoop-*.jar /opt/flink/plugins/s3-fs-hadoop/ &&
      /docker-entrypoint.sh jobmanager
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks: [de05]

  taskmanager:
    image: apache/flink:1.20.1-scala_2.12-java17
    container_name: de-05-taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        execution.checkpointing.mode: EXACTLY_ONCE
        # Checkpoints go to object storage too, which is what a real cluster does.
        state.checkpoints.dir: s3://orders/flink-checkpoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
    command: >
      /bin/bash -c "
      mkdir -p /opt/flink/plugins/s3-fs-hadoop &&
      cp /opt/flink/opt/flink-s3-fs-hadoop-*.jar /opt/flink/plugins/s3-fs-hadoop/ &&
      /docker-entrypoint.sh taskmanager
      "
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'Successful registration at resource manager' /opt/flink/log/*taskexecutor*.log"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks: [de05]

networks:
  de05:
    name: de-05-flink-s3

volumes:
  minio-data:
