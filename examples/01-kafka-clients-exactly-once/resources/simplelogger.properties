# Keeps the Kafka client's start-up chatter out of the way, so the only lines
# you see are the ones this example prints. Raise this to `info` if you want to
# watch the client's own view of the transaction.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showDateTime=false
