# Single-node Apache Kafka in KRaft mode, plus a web UI to look at the topics.
#
# KRaft ("Kafka Raft") is the metadata mode that replaced Apache ZooKeeper: the
# broker keeps cluster metadata itself, so one container is a whole cluster.
# This node plays both roles at once (`process.roles=broker,controller`).
#
# Host ports are confined to the 10100-10199 range that belongs to example 01,
# so this stack can run side by side with every other example in the repository.
name: de-01-eos

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: de-01-kafka
    ports:
      # Only the host-facing listener is published. 9092 stays inside the
      # network for container-to-container traffic such as the web UI.
      - "10192:10192"
    environment:
      # --- KRaft identity -------------------------------------------------
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # A fixed cluster id keeps the storage directory reusable across restarts.
      CLUSTER_ID: "de-01-exactly-once-demo"

      # --- Listeners ------------------------------------------------------
      # Three listeners: one for other containers, one for the controller
      # quorum, and one advertised as `localhost:10192` for the JVM you run
      # `./mill run` in. A client always reconnects to the *advertised* address,
      # so the host listener has to advertise a name the host can resolve.
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:10192"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,HOST://localhost:10192"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # --- Single-node sizing ---------------------------------------------
      # Every internal topic defaults to three replicas, which a one-broker
      # cluster can never satisfy. Transactions in particular refuse to start
      # until the transaction state log is writable, so these three settings are
      # what makes `initTransactions()` succeed here.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # With one broker there is nothing to rebalance onto, so start consuming
      # immediately instead of waiting the default three seconds per group.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - de-01
    healthcheck:
      # Listing topics only succeeds once the broker is accepting client
      # requests, which is exactly the moment the example can start.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Creates the two topics up front, so the first run shows the intended
  # partition count instead of whatever automatic creation happens to pick.
  topic-setup:
    image: apache/kafka:4.3.1
    container_name: de-01-topic-setup
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for topic in orders payments; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    networks:
      - de-01
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    container_name: de-01-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      topic-setup:
        condition: service_completed_successfully
    ports:
      - "10180:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "de-01-exactly-once"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - de-01
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  de-01:
    name: de-01-eos

volumes:
  kafka-data:
    name: de-01-eos-kafka-data
