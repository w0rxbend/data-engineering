# The lakehouse catalog: Delta Lake tables whose Parquet files live in MinIO.
#
# "Delta Lake" is a table format: a folder of Parquet files plus a transaction log
# (_delta_log) that says which of those files belong to the current version of the
# table. Trino reads that log, so it sees exactly the same table an Apache Spark job
# would see.
connector.name=delta_lake

# Where the table definitions live. The metastore answers "which tables exist and in
# which folder", the connector then reads the files itself.
hive.metastore.uri=thrift://hive-metastore:9083

# Trino's own S3 client - no Hadoop libraries involved on this side.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin

# Writing a Delta table safely from several engines at once needs a locking service.
# This stack has exactly one writer, so the check is switched off and Trino may create
# and fill tables here.
delta.enable-non-concurrent-writes=true
