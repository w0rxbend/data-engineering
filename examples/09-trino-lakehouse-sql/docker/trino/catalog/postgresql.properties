# The operational catalog: tables that stay inside PostgreSQL.
#
# Trino does not copy or cache these rows. Every query opens a JDBC connection, pushes
# down as much of the work as PostgreSQL can do (filters, some aggregations) and reads
# back the rest.
connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/shop
connection-user=shop
connection-password=shop
