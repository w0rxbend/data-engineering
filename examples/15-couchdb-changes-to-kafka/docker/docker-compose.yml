name: de-15-couchdb-cdc

# Four containers: Apache CouchDB holding the product catalogue, a one-shot init container that prepares it, a
# single-node Apache Kafka broker in KRaft mode, and a web interface for browsing the Kafka topic. Every published host
# port stays inside the 11500-11599 range reserved for example 15, so this stack runs happily next to every other
# example in the repository.

services:
  couchdb:
    image: couchdb:3.5.0
    container_name: de-15-couchdb
    ports:
      # CouchDB's HTTP interface. It is also its web interface: http://localhost:11598/_utils
      - "11598:5984"
    environment:
      # A single-node CouchDB started without an administrator refuses to do anything useful ("admin party" was
      # removed in 3.x), so a user is created on first boot from these two variables.
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: couchdb
      # Tells CouchDB it is a one-node cluster, which is what makes the `_up` endpoint report healthy.
      COUCHDB_SINGLE_NODE: "true"
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      # `_up` answers 200 only once this node is able to serve requests.
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5984/_up || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - de-15

  couchdb-init:
    image: curlimages/curl:8.11.1
    container_name: de-15-couchdb-init
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: couchdb
    volumes:
      - ./couchdb-init.sh:/seed/couchdb-init.sh:ro
      - ./catalogue-seed.json:/seed/catalogue-seed.json:ro
    entrypoint: ["/bin/sh", "/seed/couchdb-init.sh"]
    networks:
      - de-15

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: de-15-kafka
    ports:
      # Only the "HOST" listener is published, for the connector running on your machine.
      - "11592:11592"
    environment:
      # KRaft mode: this one container is both the broker that stores the data and the controller that holds the
      # cluster metadata, so no ZooKeeper is involved. CLUSTER_ID names that metadata.
      CLUSTER_ID: de15couchdbcdcexample01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://kafka:29092,CONTROLLER://kafka:29093,HOST://0.0.0.0:11592
      # A Kafka client is told where to reconnect by the broker itself, so the address advertised on the host
      # listener has to be the one reachable from your machine.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:11592
      # A single broker cannot keep more than one copy of anything.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Compaction runs often and keeps almost nothing, so the effect of a tombstone is visible within a run of this
      # example rather than hours later. These are teaching values, not production ones.
      KAFKA_LOG_CLEANER_ENABLE: "true"
      KAFKA_LOG_CLEANER_MIN_CLEANABLE_RATIO: "0.001"
      KAFKA_LOG_CLEANER_BACKOFF_MS: 1000
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - de-15

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: de-15-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # Browse the topic, its records and their keys at http://localhost:11580
      - "11580:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: de-15
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - de-15

networks:
  de-15:
    name: de-15-couchdb-cdc

volumes:
  couchdb-data:
    name: de-15-couchdb-cdc-couchdb-data
  kafka-data:
    name: de-15-couchdb-cdc-kafka-data
