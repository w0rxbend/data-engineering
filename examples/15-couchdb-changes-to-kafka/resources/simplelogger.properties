# Keeps the Kafka producer's start-up chatter out of the way, so the only lines
# you see are the ones this example prints while it follows CouchDB's `_changes`
# feed. Raise this to `info` if you want to watch the client's own view.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showDateTime=false
