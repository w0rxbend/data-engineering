# Kafka Streams logs a lot at INFO level while it starts up, restores its state
# stores and shuts down again. Keeping it at `warn` means the only lines you see
# are the ones this example prints. Raise this to `info` if you want to watch
# the library's own view of the topology.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showDateTime=false
