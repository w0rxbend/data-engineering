name: de-02-fraud

# A single-node Apache Kafka cluster in KRaft mode plus a web UI.
#
# KRaft ("Kafka Raft") is Kafka's own consensus protocol. Until Kafka 3.x a
# separate Apache ZooKeeper cluster stored the metadata; since Kafka 4.0
# ZooKeeper is gone and the broker keeps its own metadata, which is why this
# file needs one container for the broker instead of two.
#
# Host ports are confined to the 10200-10299 range reserved for example 02, so
# this stack can run side by side with every other example in the repository.

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: de-02-kafka
    ports:
      # Clients on the host (the Mill application) connect here.
      - "10292:10292"
    environment:
      # KRaft: this one node is both the broker (serves data) and the
      # controller (keeps the cluster metadata).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Three listeners: one for containers on this network, one for the host,
      # and one for the controller traffic. A client is told to use the
      # advertised address that matches the listener it arrived on, which is
      # why the host needs its own listener with its own port.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:10292
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:10292
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # A single broker cannot hold more than one copy of anything, so every
      # replication default has to come down from the usual three.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: de02kafkastreamsfraud01
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - fraud

  # Creates the four topics the example uses and then exits. Auto-creation
  # would give `customer-risk` the wrong cleanup policy: a table topic has to
  # be compacted so that the newest value per customer is kept forever.
  topics:
    image: apache/kafka:4.1.0
    container_name: de-02-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        set -e;
        TOPICS=/opt/kafka/bin/kafka-topics.sh;
        BROKER=kafka:9092;
        for topic in orders payments fraud-alerts; do
        $$TOPICS --bootstrap-server $$BROKER --create --if-not-exists
        --topic $$topic --partitions 3 --replication-factor 1;
        done;
        $$TOPICS --bootstrap-server $$BROKER --create --if-not-exists
        --topic customer-risk --partitions 3 --replication-factor 1
        --config cleanup.policy=compact;
        $$TOPICS --bootstrap-server $$BROKER --list
    networks:
      - fraud

  # A browser view of the cluster: topics, partitions, and the messages in
  # them. Handy for watching `fraud-alerts` fill up.
  kafka-ui:
    image: kafbat/kafka-ui:v1.1.0
    container_name: de-02-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "10280:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: de-02-fraud
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - fraud

networks:
  fraud:
    name: de-02-fraud

volumes:
  kafka-data:
    name: de-02-kafka-data
