# Local stack for example 11: Apache Parquet on disk and Apache Arrow in memory.
#
# This is the smallest stack in the repository, and that is the point. Parquet is a file
# format and Arrow is a memory format; neither needs a server, a coordinator or a
# metastore. Everything the example demonstrates runs inside one JVM (Java Virtual
# Machine) process against a directory on disk.
#
# The one service here exists to make a single point concrete: the bytes a Parquet writer
# produces do not care where they land. MinIO speaks the Amazon S3 (Simple Storage
# Service) API, so pointing the same example at object storage instead of a local
# directory changes nothing about the file format - only where the file is put.
#
# Every published host port is inside this example's reserved range 11100-11199, so this
# stack runs side by side with every other example in the repository.
name: de-11-parquet-arrow

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: de-11-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # S3 API, the endpoint the example uploads to: http://localhost:11100
      - "11100:9000"
      # Web console, to browse and download the archived files: http://localhost:11101
      - "11101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # `mc ready` is MinIO's own readiness probe: it reports healthy only once the
      # server accepts S3 requests, which is later than the port opening.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks: [de11]

  # A one-shot container that creates the bucket and exits. The example would create it
  # too, but having it exist beforehand means the first upload needs no extra permission
  # and the console shows the bucket even before anything has been written.
  minio-init:
    # Explicit batch setup: `docker compose run --rm minio-init` returns its exit code.
    profiles: [setup]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: de-11-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/archive &&
      echo 'bucket local/archive is ready'
      "
    networks: [de11]

networks:
  de11:
    name: de-11-parquet-arrow

volumes:
  minio-data:
