# The Parquet, Hadoop and Arrow libraries log a line per row group, per codec and per
# allocator at INFO level, which would bury this example's own output. Only warnings and
# errors are shown; raise this to `info` to watch the libraries work.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
# Hadoop warns once that it found no compiled native library and will use its pure-Java
# implementations instead. That is exactly what this example wants, so the warning is noise.
org.slf4j.simpleLogger.log.org.apache.hadoop.util.NativeCodeLoader=error
