# Keeps the Kafka client's start-up chatter out of the way, so the only lines you
# see are the operational report this example prints. Raise this to `info` to watch
# the AdminClient's own view of the cluster, including which broker each request
# was routed to.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showDateTime=false
