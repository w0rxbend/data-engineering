name: de-03-ksqldb

# Three containers: one Apache Kafka broker, the ksqlDB server that runs SQL
# against its topics, and the ksqlDB command line client for poking around by
# hand. Every host port stays inside the 10300-10399 range reserved for example
# 03, so this stack can run next to every other example in the repository.

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: de-03-kafka
    ports:
      # Only the "HOST" listener is published, for tools running on your machine.
      - "10392:10392"
    environment:
      # KRaft mode: this single container is both the broker that stores data
      # and the controller that holds the cluster metadata, so no ZooKeeper is
      # needed. CLUSTER_ID is a fixed identifier for that metadata.
      CLUSTER_ID: de03ksqldbexample000001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://kafka:29092,CONTROLLER://kafka:29093,HOST://0.0.0.0:10392
      # A Kafka client is told where to reconnect by the broker itself, so the
      # address advertised on the host listener must be the one you can reach.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:10392
      # A single broker cannot keep more than one copy of anything.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - de-03

  ksqldb-server:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: de-03-ksqldb-server
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # The REST API the Scala client talks to, and the same address you can
      # open in a browser to see the server's health report.
      - "10388:8088"
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:29092
      KSQL_LISTENERS: http://0.0.0.0:8088
      # Prefix of the internal topics this server creates; keeping it unique
      # stops two examples from sharing state if they ever meet on one broker.
      KSQL_KSQL_SERVICE_ID: de-03-ksqldb-orders
      KSQL_KSQL_STREAMS_AUTO_OFFSET_RESET: earliest
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: 1
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 1
      KSQL_KSQL_SINK_REPLICAS: 1
      # Answer pull queries even while a table is still catching up, which keeps
      # the last step of the example from failing on a cold start.
      KSQL_KSQL_QUERY_PULL_TABLE_SCAN_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8088/healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s
    networks:
      - de-03

  ksqldb-cli:
    image: confluentinc/ksqldb-cli:0.29.0
    container_name: de-03-ksqldb-cli
    depends_on:
      ksqldb-server:
        condition: service_healthy
    # The image starts an interactive shell, which would exit immediately when
    # started in the background. It is kept idle instead, so you can attach to
    # it with `docker compose exec` whenever you want to type SQL by hand.
    entrypoint: ["/bin/sh", "-c", "exec tail -f /dev/null"]
    networks:
      - de-03

networks:
  de-03:
    name: de-03-ksqldb

volumes:
  kafka-data:
    name: de-03-ksqldb-kafka-data
