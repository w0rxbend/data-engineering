# The `hive` catalog: PrestoDB's Hive connector, pointed at the standalone
# metastore and at MinIO. A catalog file's name becomes the catalog name, so this
# file is what makes `hive.shop.clickstream` a valid table reference.
connector.name=hive-hadoop2

# Where to ask which tables and partitions exist.
hive.metastore.uri=thrift://hive-metastore:9083

# PrestoDB ships its own S3 client rather than using Hadoop's S3A, so the object
# storage settings are named `hive.s3.*` and are configured here, not in a
# Hadoop XML file. Path-style access puts the bucket in the URL path, which is
# what a local MinIO container needs.
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=minioadmin
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false

# `sync_partition_metadata` walks the table location and registers the partition
# directories it finds. It is a procedure, so it has to be enabled explicitly.
hive.allow-drop-table=true
hive.allow-rename-table=true

# Statistics collected by ANALYZE are what feed the row-count estimates printed by
# EXPLAIN. Without this the planner falls back to guesses.
hive.table-statistics-enabled=true
hive.partition-statistics-based-optimization-enabled=true
