# Single-node PrestoDB: this one process is both the coordinator (it plans queries
# and hands out work) and a worker (it does that work). A real cluster separates
# the two; for an example, one process keeps the moving parts down.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery-server.enabled=true
discovery.uri=http://localhost:8080

# How much memory a single query may use across the cluster, and on one node. The
# defaults are sized for a production machine; these values fit the 2 GiB heap
# configured in jvm.config.
query.max-memory=1GB
query.max-memory-per-node=512MB
query.max-total-memory-per-node=768MB
