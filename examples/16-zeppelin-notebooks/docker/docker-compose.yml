# Example 16 - Apache Zeppelin in front of a small lakehouse.
#
# Long-lived services:
#
#   minio           object storage speaking the Amazon S3 protocol; holds the Parquet files
#   hive-metastore  the catalogue that remembers which tables exist and where their files are
#   trino           the SQL engine the seeding helper and the %jdbc paragraphs talk to
#   zeppelin        the notebook server, the only thing a reader has to open
#
# One-shot init containers, each of which must finish before the services that need it start:
#
#   minio-init           creates the `lakehouse` bucket
#   hive-metastore-init  hands the metastore's volume to its unprivileged user
#   zeppelin-init        installs the shipped notebooks and interpreter configuration, and
#                        downloads the Apache Spark distribution, the Delta Lake connector,
#                        the S3A filesystem and the Trino driver that Zeppelin needs
#
# Every published host port is inside this example's reserved range 11600-11699, so this
# stack runs side by side with every other example in the repository.
name: de-16-zeppelin

# Pinned versions, repeated nowhere else in this file.
x-versions:
  spark: &spark-version "3.5.3"
  delta: &delta-version "3.2.1"
  hadoop: &hadoop-version "3.3.4"
  aws-sdk: &aws-sdk-version "1.12.262"
  trino-jdbc: &trino-jdbc-version "476"

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: de-16-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    ports:
      # 11600 is the S3 protocol endpoint, 11601 the browser console.
      - "11600:9000"
      - "11601:9001"
    volumes:
      - minio-data:/data
    networks: [de16]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the one bucket the lakehouse uses, then exits. `mc` is MinIO's command line
  # client; `mb --ignore-existing` makes a second run a no-op.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: de-16-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/lakehouse
        echo "bucket lakehouse is ready"
    networks: [de16]

  # A Docker named volume starts out owned by root, while the Hive image runs as the
  # unprivileged `hive` user (uid 1000). This one-shot container hands the volume over so
  # the metastore may create its Derby database inside it.
  hive-metastore-init:
    image: apache/hive:4.0.1
    container_name: de-16-hive-metastore-init
    user: "root"
    entrypoint: ["/bin/sh", "-c", "chown -R 1000:1000 /opt/hive/derby"]
    volumes:
      - metastore-db:/opt/hive/derby
    networks: [de16]

  hive-metastore:
    image: apache/hive:4.0.1
    container_name: de-16-hive-metastore
    depends_on:
      minio-init:
        condition: service_completed_successfully
      hive-metastore-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: "metastore"
      DB_DRIVER: "derby"
      HIVE_CUSTOM_CONF_DIR: "/hive-custom-conf"
      # Hadoop ships its S3A filesystem in a folder that is not on the default classpath.
      # Adding it here is what lets the metastore create a folder in MinIO.
      HIVE_AUX_JARS_PATH: "/opt/hadoop/share/hadoop/tools/lib"
    volumes:
      - ./hive:/hive-custom-conf:ro
      - metastore-db:/opt/hive/derby
    networks: [de16]
    healthcheck:
      # The metastore speaks Thrift, a binary protocol with no health endpoint, so the check
      # is whether the port accepts a connection. Bash can open a TCP socket through its
      # /dev/tcp pseudo device, which saves installing a tool.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9083"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  trino:
    image: trinodb/trino:476
    container_name: de-16-trino
    depends_on:
      hive-metastore:
        condition: service_healthy
    ports:
      # Coordinator and web interface share one port: http://localhost:11680
      - "11680:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    networks: [de16]
    healthcheck:
      # The image ships a readiness probe that reports healthy only once the coordinator can
      # actually accept a query.
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # Everything the Zeppelin container needs but the Zeppelin image does not contain.
  #
  # It runs the Zeppelin image itself, on purpose: a Docker named volume is pre-filled from
  # the image of the first container that mounts it, so using the same image keeps the
  # log4j configuration and the interpreter folder that ship inside `conf` and `notebook`.
  #
  # Every step is idempotent, so `docker compose up` a second time re-installs the shipped
  # notebooks (discarding browser edits to them) but does not download anything again.
  zeppelin-init:
    image: apache/zeppelin:0.12.0
    container_name: de-16-zeppelin-init
    user: "root"
    environment:
      SPARK_VERSION: *spark-version
      DELTA_VERSION: *delta-version
      HADOOP_VERSION: *hadoop-version
      AWS_SDK_VERSION: *aws-sdk-version
      TRINO_JDBC_VERSION: *trino-jdbc-version
    volumes:
      # The example's own files, read-only: this container copies them, it never edits them.
      - ../resources:/staging:ro
      - zeppelin-conf:/opt/zeppelin/conf
      - zeppelin-notebook:/opt/zeppelin/notebook
      - lakehouse-tools:/opt/lakehouse
    entrypoint:
      - /bin/bash
      - -euo
      - pipefail
      - -c
      - |
        maven="https://repo1.maven.org/maven2"
        spark_dir="/opt/lakehouse/spark"

        # 1. The Apache Spark distribution. The Zeppelin image contains the interpreter that
        #    drives Spark but no Spark itself, so SPARK_HOME has to be provided.
        if [ ! -d "$${spark_dir}" ]; then
          echo "downloading Apache Spark $${SPARK_VERSION}"
          curl -fsSL -o /tmp/spark.tgz \
            "https://archive.apache.org/dist/spark/spark-$${SPARK_VERSION}/spark-$${SPARK_VERSION}-bin-hadoop3.tgz"
          mkdir -p "$${spark_dir}"
          tar -xzf /tmp/spark.tgz -C "$${spark_dir}" --strip-components=1
          rm /tmp/spark.tgz
        fi

        # 2. Delta Lake and the S3A filesystem. Dropping the jars into the distribution's
        #    own `jars` folder puts them on the Spark classpath with no further configuration.
        fetch() {
          if [ ! -f "$$2" ]; then
            echo "downloading $$(basename "$$2")"
            curl -fsSL -o "$$2" "$$1"
          fi
        }
        fetch "$${maven}/io/delta/delta-spark_2.12/$${DELTA_VERSION}/delta-spark_2.12-$${DELTA_VERSION}.jar" \
              "$${spark_dir}/jars/delta-spark_2.12-$${DELTA_VERSION}.jar"
        fetch "$${maven}/io/delta/delta-storage/$${DELTA_VERSION}/delta-storage-$${DELTA_VERSION}.jar" \
              "$${spark_dir}/jars/delta-storage-$${DELTA_VERSION}.jar"
        fetch "$${maven}/org/apache/hadoop/hadoop-aws/$${HADOOP_VERSION}/hadoop-aws-$${HADOOP_VERSION}.jar" \
              "$${spark_dir}/jars/hadoop-aws-$${HADOOP_VERSION}.jar"
        fetch "$${maven}/com/amazonaws/aws-java-sdk-bundle/$${AWS_SDK_VERSION}/aws-java-sdk-bundle-$${AWS_SDK_VERSION}.jar" \
              "$${spark_dir}/jars/aws-java-sdk-bundle-$${AWS_SDK_VERSION}.jar"

        # 3. The jars every interpreter gets on its classpath, through the
        #    ZEPPELIN_INTP_CLASSPATH_OVERRIDES variable set on the zeppelin service:
        #    the Trino driver the %jdbc paragraphs need, and the Hadoop client the
        #    Zeppelin jdbc interpreter itself needs in order to start at all.
        mkdir -p /opt/lakehouse/jars
        fetch "$${maven}/io/trino/trino-jdbc/$${TRINO_JDBC_VERSION}/trino-jdbc-$${TRINO_JDBC_VERSION}.jar" \
              "/opt/lakehouse/jars/trino-jdbc-$${TRINO_JDBC_VERSION}.jar"
        cp -n "$${spark_dir}"/jars/hadoop-client-api-*.jar /opt/lakehouse/jars/
        cp -n "$${spark_dir}"/jars/hadoop-client-runtime-*.jar /opt/lakehouse/jars/

        # 4. The example's interpreter configuration and notebooks. Zeppelin rewrites both
        #    when a reader edits them in the browser, so they are copied into writable
        #    volumes rather than bind-mounted from the repository.
        cp /staging/interpreter/interpreter.json /opt/zeppelin/conf/interpreter.json
        rm -rf /opt/zeppelin/notebook/*
        cp /staging/notebooks/*.zpln /opt/zeppelin/notebook/

        # 5. Zeppelin runs as uid 1000; the volumes were created by root.
        chown -R 1000:0 /opt/zeppelin/conf /opt/zeppelin/notebook /opt/lakehouse
        echo "zeppelin assets are ready"
    networks: [de16]

  zeppelin:
    image: apache/zeppelin:0.12.0
    container_name: de-16-zeppelin
    depends_on:
      zeppelin-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    environment:
      ZEPPELIN_ADDR: "0.0.0.0"
      # The same value as the SPARK_HOME property in interpreter.json. Zeppelin reads the
      # property; the variable is here so a shell inside the container agrees with it.
      SPARK_HOME: "/opt/lakehouse/spark"
      # Prepended to the classpath of every interpreter process. The Zeppelin jdbc
      # interpreter refuses to start without Hadoop's security classes on the classpath,
      # and the Trino driver has to come from somewhere; this folder holds both.
      ZEPPELIN_INTP_CLASSPATH_OVERRIDES: "/opt/lakehouse/jars/*"
      # Extra options for every `spark-submit` the Spark interpreter runs. Spark starts a
      # local Derby database for its own Hive support and puts it in the working directory,
      # which is read-only here; this points it at a writable folder instead.
      SPARK_SUBMIT_OPTIONS: "--driver-java-options -Dderby.system.home=/tmp/derby"
    ports:
      # The notebook interface: http://localhost:11690
      - "11690:8080"
      # The Spark driver's own web interface, available while a %spark paragraph is running.
      - "11640:4040"
    volumes:
      - zeppelin-conf:/opt/zeppelin/conf
      - zeppelin-notebook:/opt/zeppelin/notebook
      - zeppelin-logs:/opt/zeppelin/logs
      - lakehouse-tools:/opt/lakehouse
    networks: [de16]
    healthcheck:
      # The server accepts connections on its web port only once it has finished booting,
      # so opening a TCP socket through bash's /dev/tcp pseudo device is check enough.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

networks:
  de16:
    name: de-16-zeppelin

volumes:
  minio-data:
  metastore-db:
  zeppelin-conf:
  zeppelin-notebook:
  zeppelin-logs:
  lakehouse-tools:
