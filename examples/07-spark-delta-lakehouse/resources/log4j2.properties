# Apache Spark and Delta Lake log a great deal at INFO level, including whole
# query plans. This example is meant to be read, so only warnings and errors
# reach the console; raise the level to info while debugging a job.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

# The banner Spark prints while starting up is not a warning, and repeating it
# on every run adds nothing.
logger.sparkcontext.name = org.apache.spark.SparkContext
logger.sparkcontext.level = error
